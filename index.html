<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>405 國語課專用閱讀器 v5｜雲端同步版</title>

<style>
:root{
  --bg:#eef3ee;
  --paper:#fffdf8;
  --ink:#252b28;
  --muted:#748078;
  --accent:#55786b;
  --accent-dark:#3f6256;
  --accent2:#e5eee9;
  --border:#d8e0da;
  --danger:#a45b52;
  --toolbar:rgba(250,252,249,.96);
  --shadow:0 4px 18px rgba(55,75,65,.08);
  --font-size:52px;
  --line-height:2.15;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink)}
body{font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;overflow:hidden}
button,input,textarea,select{font:inherit}

#app{height:100vh;display:flex;flex-direction:column}
.topbar{
  min-height:64px;flex:0 0 64px;
  display:flex;align-items:center;gap:6px;
  padding:8px 12px;background:var(--toolbar);
  border-bottom:1px solid var(--border);z-index:30;
  box-shadow:var(--shadow);backdrop-filter:blur(8px);
}
.brand{
  font-weight:800;font-size:17px;white-space:nowrap;color:var(--accent-dark);
  letter-spacing:.03em;margin-right:2px
}
.lesson-select{
  max-width:180px;height:38px;border:1px solid var(--border);
  border-radius:9px;background:#fff;padding:0 9px;color:var(--ink)
}
.lesson-title{
  font-weight:700;font-size:16px;color:var(--accent);
  max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap
}
.spacer{flex:1}
.btn{
  border:1px solid transparent;background:transparent;color:#445149;
  border-radius:9px;padding:6px 8px;cursor:pointer;min-height:38px;
  transition:.15s ease;white-space:nowrap
}
.btn:hover{background:#edf3ef;border-color:var(--border)}
.btn.active{background:var(--accent);color:white;border-color:var(--accent)}
.btn.slim{padding:6px 8px}
.btn.warn{color:var(--danger)}
.btn.strong{font-weight:700}
.group{
  display:flex;align-items:center;gap:1px;padding:2px;
  background:#f3f6f3;border-radius:10px
}

.stage{
  position:relative;flex:1;min-height:0;background:var(--paper);overflow:hidden;
  margin:10px 12px 12px;border-radius:18px;
  box-shadow:0 2px 14px rgba(55,75,65,.06);
  border:1px solid rgba(216,224,218,.75);
}
.reading-wrap{
  position:absolute;inset:0;padding:32px 72px 72px 72px;
  overflow-x:auto;overflow-y:hidden;
}
.vertical-text{
  height:100%;width:max-content;min-width:100%;
  writing-mode:vertical-rl;text-orientation:mixed;
  font-family:DFKai-SB,BiauKai,"標楷體","Kaiti TC","KaiTi",serif;
  font-size:var(--font-size);line-height:var(--line-height);
  letter-spacing:.06em;white-space:pre-wrap;text-align:start;padding-top:6px;
}
.vertical-text p{margin:0 0 0 1.1em;text-indent:2em}
.vertical-text p + p{margin-right:1.3em}

#segButtons{display:flex;gap:3px;align-items:center;overflow-x:auto;max-width:300px}
.seg-btn{
  border:0;background:transparent;border-radius:8px;
  min-width:34px;height:34px;cursor:pointer;color:#56635c
}
.seg-btn:hover{background:#edf3ef}
.seg-btn.active{background:var(--accent2);color:var(--accent-dark);font-weight:800}

.footer{
  position:absolute;left:18px;bottom:14px;display:flex;gap:8px;align-items:center;
  color:var(--muted);font-size:13px;z-index:8;background:rgba(255,253,248,.82);
  padding:5px 9px;border-radius:9px
}
.autosave{color:var(--accent);font-weight:700}

#inkCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:14;pointer-events:none}
.drawing #inkCanvas{pointer-events:auto;touch-action:none;cursor:crosshair}
.drawing .reading-wrap{overflow:hidden}

.drawbar{
  position:absolute;right:18px;bottom:16px;z-index:18;
  display:none;gap:5px;background:rgba(250,252,249,.97);
  padding:6px;border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow)
}
.drawing .drawbar{display:flex}

.notes-panel{
  position:absolute;top:0;left:0;width:min(420px,38vw);height:100%;
  background:rgba(252,253,250,.98);border-right:1px solid var(--border);
  z-index:22;transform:translateX(-102%);transition:.2s ease;
  display:flex;flex-direction:column;box-shadow:8px 0 24px rgba(55,75,65,.08)
}
.notes-panel.show{transform:translateX(0)}
.notes-head{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.notes-head h3{margin:0;font-size:17px;color:var(--accent-dark)}
.notes-body{padding:14px;display:flex;flex-direction:column;gap:10px;flex:1;min-height:0}
.notes-body textarea{
  flex:1;min-height:200px;resize:none;border:1px solid var(--border);
  border-radius:12px;padding:12px;line-height:1.6;background:#fffefb
}
.note-hint{font-size:13px;color:var(--muted);line-height:1.5}

.modal{
  position:fixed;inset:0;background:rgba(31,42,36,.32);display:none;
  align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(3px)
}
.modal.show{display:flex}
.panel{
  width:min(940px,92vw);max-height:90vh;overflow:auto;background:#fcfdfb;
  border-radius:18px;padding:22px;box-shadow:0 18px 55px rgba(40,55,47,.18);
  border:1px solid var(--border)
}
.panel h2{margin:0 0 14px;color:var(--accent-dark)}
.field{margin:12px 0}
.field label{display:block;font-weight:700;margin-bottom:7px}
.field input,.field textarea{
  width:100%;border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:#fff
}
.field textarea{height:330px;resize:vertical;line-height:1.6}
.hint{color:var(--muted);font-size:14px;line-height:1.6}
.panel-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.library-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.file-input{display:none}

@media (max-width:1450px){
  .brand{display:none}
  .lesson-title{display:none}
  .lesson-select{max-width:150px}
  #segButtons{max-width:240px}
  .topbar{gap:3px;padding-left:7px;padding-right:7px}
  .btn{padding:6px 7px;font-size:14px}
}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand">405 國語閱讀器</div>

    <select id="lessonSelect" class="lesson-select" title="課程庫"></select>
    <button class="btn slim" id="libraryBtn">課程</button>

    <div class="lesson-title" id="titleDisplay"></div>

    <button class="btn slim" id="prevBtn">‹</button>
    <button class="btn slim" id="allBtn">全文</button>
    <div id="segButtons"></div>
    <button class="btn slim" id="nextBtn">›</button>

    <div class="spacer"></div>

    <div class="group">
      <button class="btn slim" id="fontMinus">A−</button>
      <button class="btn slim" id="fontPlus">A＋</button>
    </div>
    <div class="group">
      <button class="btn slim" id="gapMinus">行距−</button>
      <button class="btn slim" id="gapPlus">行距＋</button>
    </div>

    <button class="btn slim" id="penQuick">✏ 筆</button>
    <button class="btn slim" id="highlighterQuick">▰ 螢光</button>
    <button class="btn slim" id="exitDraw" style="display:none">完成書寫</button>

    <button class="btn slim" id="notesBtn">備課</button>
    <button class="btn slim" id="editBtn">編輯</button>
    <button class="btn slim strong" id="quickExport" title="登入後將本機資料存到雲端">☁ 雲端儲存</button>
    <button class="btn slim strong" id="quickImport" title="從雲端取得最新資料">↻ 雲端更新</button>
    <input class="file-input" type="file" id="quickImportFile" accept=".json,application/json">
    <button class="btn slim" id="fullscreenBtn">⛶</button>
  </div>

  <div class="stage" id="stage">
    <div class="reading-wrap" id="readingWrap">
      <div class="vertical-text" id="textArea"></div>
    </div>

    <canvas id="inkCanvas"></canvas>

    <div class="drawbar">
      <button class="btn slim active" data-tool="pen">✏ 筆</button>
      <button class="btn slim" data-tool="highlighter">🖍️ 直線螢光筆</button>
      <button class="btn slim" data-tool="eraser">橡皮擦</button>
      <button class="btn slim warn" id="clearInk">清除筆記</button>
    </div>

    <aside class="notes-panel" id="notesPanel">
      <div class="notes-head">
        <h3 id="notesTitle">備課筆記</h3>
        <div class="spacer"></div>
        <button class="btn slim" id="closeNotes">關閉</button>
      </div>
      <div class="notes-body">
        <div class="note-hint">
          這裡是老師自己的備課欄。切換段落時會自動切換到該段筆記，輸入即自動儲存。
        </div>
        <textarea id="teacherNotes" placeholder="例如：&#10;・提醒「精神食糧」&#10;・問：這裡為什麼這樣寫？&#10;・帶學生找動作描寫"></textarea>
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
            <button class="btn slim" id="addNoteImage">＋ 圖片</button>
            <span class="note-hint">圖片會跟著本課／本段備課儲存</span>
            <input class="file-input" type="file" id="noteImageInput" accept="image/*" multiple>
          </div>
          <div id="noteImages" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;max-height:220px;overflow:auto"></div>
      </div>
    </aside>

    <div class="footer">
      <span id="pageInfo"></span>
      <span>｜</span>
      <span>直排・段首空兩格</span>
      <span>｜</span>
      <span class="autosave" id="saveStatus">本機安全備份</span>
    </div>
  </div>
</div>

<!-- 編輯課文 -->
<div class="modal" id="editorModal">
  <div class="panel">
    <h2>編輯本課</h2>
    <div class="field">
      <label>課名</label>
      <input id="editTitle" type="text">
    </div>
    <div class="field">
      <label>課文</label>
      <textarea id="editText"></textarea>
      <div class="hint">
        每個自然段之間空一行。儲存後會自動產生第 1、2、3……段按鈕。<br>
        不必手動打段首空格，閱讀器會自動縮排兩格。
      </div>
    </div>
    <div class="panel-actions">
      <button class="btn" id="cancelEdit">取消</button>
      <button class="btn active" id="saveEdit">套用並儲存</button>
    </div>
  </div>
</div>

<!-- 課程庫 -->
<div class="modal" id="libraryModal">
  <div class="panel" style="width:min(650px,92vw)">
    <h2>課程庫</h2>
    <div class="hint">課程仍會保留本機安全備份；登入雲端後會同步到 Supabase。前後兩台電腦使用同一雲端帳號即可共用最新版。</div>

    <div class="field">
      <label>目前課程</label>
      <input id="libraryCurrentTitle" type="text" readonly>
    </div>

    <div class="library-actions">
      <button class="btn" id="newLesson">＋ 新增課程</button>
      <button class="btn" id="duplicateLesson">複製本課</button>
       <button class="btn" id="exportLesson">💾 匯出本課</button>
       <button class="btn" id="importLesson">📂 匯入單課</button>
       <input class="file-input" type="file" id="importLessonFile" accept=".json,application/json">
      <button class="btn" id="exportAll">💾 匯出全部備份</button>
      <button class="btn" id="importAll">📂 匯入備份</button>
      <input class="file-input" type="file" id="importFile" accept=".json,application/json">
      <button class="btn warn" id="deleteLesson">刪除本課</button>
    </div>

    <div class="panel-actions">
      <button class="btn active" id="closeLibrary">完成</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://zzsezfbuxpmwrhigfnve.supabase.co";
const SUPABASE_KEY="sb_publishable_Ua_0_GlYg9MaOaWwWdvYDg_DTz9OplI";
const cloud=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const CLOUD_ID="405-main";
let cloudTimer=null;
let cloudReady=false;
let cloudUser=null;

const STORAGE_KEY = "chineseReaderV3Library";
const SETTINGS_KEY = "chineseReaderV3Settings";

const SAMPLE = {
  id: crypto.randomUUID ? crypto.randomUUID() : "lesson-"+Date.now(),
  title: "放學後",
  paragraphs: [
    "每天到了放學的時候，我總是飛也似的趕回家。",
    "回到家裡，常有美味的點心，對著我們招招手；有時是香氣撲鼻的奶油餅乾，有時是層次分明的千層糕，有時是軟綿可口的紅豆湯。好友們常常不約而同來我家「寫功課」，大家一坐下來，總是不敵美食當前，將功課拋到腦後，把眼前的美食一掃而空。",
    "除了美味的點心，我最重要的精神食糧，就是國語日報。我和姐姐常常為了誰先看而爭吵不休，後來我們一起想出好方法：姐姐看左邊，我就看右邊；姐姐看正面，我就看反面……。我們一邊吃點心，一邊讀有趣的故事，還有什麼比這更快樂呢？",
    "寫完功課以後，就是我的玩樂時間。姐姐、同學和我會在附近的公園，玩你追我躲的警察抓小偷，有時則是玩跳繩，不管是比速度，還是比次數，大家都奮勇爭先，不落人後。我們經常玩到太陽快下山，聽到大人們紛紛呼喊：「回家吃晚餐了！」才依依不捨的結束遊戲。",
    "放學後的美好時光，不論是吃點心、看報紙，還是玩遊戲，時間總是過得特別快。多希望時間暫停，讓我可以永遠停留在這美好的幸福時光。"
  ],
  notes: {all:"", segments:["","","","",""],allImages:[],segmentImages:[[],[],[],[],[]]},
  createdAt: new Date().toISOString(),
  updatedAt: new Date().toISOString()
};

let library = loadLibrary();
let settings = loadSettings();
let currentLessonId = settings.currentLessonId && library.some(x=>x.id===settings.currentLessonId)
  ? settings.currentLessonId : library[0].id;
let current = 1; // 0=全文, 1...n
let fontSize = settings.fontSize || 52;
let lineHeight = settings.lineHeight || 2.15;

const stage = document.getElementById("stage");
const textArea = document.getElementById("textArea");
const readingWrap = document.getElementById("readingWrap");
const titleDisplay = document.getElementById("titleDisplay");
const segButtons = document.getElementById("segButtons");
const pageInfo = document.getElementById("pageInfo");
const lessonSelect = document.getElementById("lessonSelect");
const saveStatus = document.getElementById("saveStatus");

function uid(){
  return crypto.randomUUID ? crypto.randomUUID() : "lesson-"+Date.now()+"-"+Math.random().toString(16).slice(2);
}
function loadLibrary(){
  try{
    const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if(Array.isArray(data) && data.length) return data;
  }catch(e){}
  return [JSON.parse(JSON.stringify(SAMPLE))];
}
function loadSettings(){
  try{return JSON.parse(localStorage.getItem(SETTINGS_KEY)) || {}}catch(e){return {}}
}
function currentLesson(){
  return library.find(x=>x.id===currentLessonId) || library[0];
}
function ensureNotes(lesson){
  if(!lesson.notes) lesson.notes={all:"",segments:[],allImages:[],segmentImages:[]};
  if(!Array.isArray(lesson.notes.segments)) lesson.notes.segments=[];
  while(lesson.notes.segments.length < lesson.paragraphs.length) lesson.notes.segments.push("");
  if(lesson.notes.segments.length > lesson.paragraphs.length) lesson.notes.segments.length=lesson.paragraphs.length;
  if(typeof lesson.notes.all!=="string") lesson.notes.all="";
  if(!Array.isArray(lesson.notes.allImages)) lesson.notes.allImages=[];
  if(!Array.isArray(lesson.notes.segmentImages)) lesson.notes.segmentImages=[];
  while(lesson.notes.segmentImages.length < lesson.paragraphs.length) lesson.notes.segmentImages.push([]);
  if(lesson.notes.segmentImages.length > lesson.paragraphs.length) lesson.notes.segmentImages.length=lesson.paragraphs.length;
}
let saveTimer=null;
function localPayload(){
  settings.currentLessonId=currentLessonId;
  settings.fontSize=fontSize; settings.lineHeight=lineHeight;
  return {app:"405 國語課專用閱讀器",version:"5.1",library,settings:{fontSize,lineHeight,currentLessonId},savedAt:new Date().toISOString()};
}
async function refreshCloudUser(){
  const {data}=await cloud.auth.getUser(); cloudUser=data?.user||null; return cloudUser;
}
const CLOUD_REDIRECT="https://sanchongread-dotcom.github.io/405-chinese-reader/";
async function resendSignupEmail(email){
  const {error}=await cloud.auth.resend({type:"signup",email,options:{emailRedirectTo:CLOUD_REDIRECT}});
  if(error){alert("重新寄送驗證信失敗："+error.message);return false;}
  alert("新的驗證信已寄出。\n\n請只點最新一封信裡的驗證連結；完成後會回到 405 國語課閱讀器。\n原本課文仍安全留在本機。");
  return true;
}
async function cloudLogin(){
  await refreshCloudUser();
  if(cloudUser) return true;
  const email=(prompt("雲端帳號 Email：")||"").trim(); if(!email)return false;
  const password=prompt("雲端密碼（至少 6 碼）："); if(!password)return false;
  let r=await cloud.auth.signInWithPassword({email,password});
  if(!r.error){await refreshCloudUser();return !!cloudUser;}

  const msg=(r.error.message||"").toLowerCase();
  if(msg.includes("email not confirmed") || msg.includes("email_not_confirmed")){
    if(confirm("這個帳號還沒完成 Email 驗證。\n\n要現在重新寄一封新的驗證信嗎？")) await resendSignupEmail(email);
    return false;
  }

  if(msg.includes("invalid login credentials")){
    const create=confirm("目前無法登入。\n\n如果這是第一次使用這個 Email，按「確定」建立雲端帳號；如果你已經註冊過，按「取消」並確認密碼是否正確。");
    if(!create)return false;
    r=await cloud.auth.signUp({email,password,options:{emailRedirectTo:CLOUD_REDIRECT}});
    if(r.error){alert("建立帳號失敗："+r.error.message);return false;}
    if(!r.data.session){
      alert("帳號已建立／等待驗證。接著會重新寄送一封驗證信。");
      await resendSignupEmail(email);
      return false;
    }
  }else{
    alert("登入失敗："+r.error.message);return false;
  }
  await refreshCloudUser(); return !!cloudUser;
}
async function saveCloud(showAlert=false){
  if(!cloudReady)return;
  if(!await refreshCloudUser()){ saveStatus.textContent="已存本機｜未登入雲端"; return; }
  saveStatus.textContent="☁ 雲端儲存中…";
  const {error}=await cloud.from("reader_state").update({payload:localPayload(),updated_at:new Date().toISOString()}).eq("id",CLOUD_ID);
  if(error){saveStatus.textContent="雲端未儲存"; if(showAlert)alert("雲端儲存失敗："+error.message);return;}
  saveStatus.textContent="☁ 已同步"; if(showAlert)alert("已儲存到雲端。前面電腦按「雲端更新」即可取得。")
}
function queueCloudSave(){
  clearTimeout(cloudTimer); cloudTimer=setTimeout(()=>saveCloud(false),900);
}
async function loadCloud(force=false){
  saveStatus.textContent="☁ 讀取雲端…";
  const {data,error}=await cloud.from("reader_state").select("payload,updated_at").eq("id",CLOUD_ID).single();
  if(error){saveStatus.textContent="本機模式";return false;}
  const p=data?.payload;
  if(p && Array.isArray(p.library) && p.library.length){
    if(force || confirm("雲端有已儲存的課程資料。要載入雲端最新版嗎？")){
      library=p.library; library.forEach(ensureNotes);
      if(p.settings){fontSize=p.settings.fontSize||fontSize;lineHeight=p.settings.lineHeight||lineHeight;currentLessonId=library.some(x=>x.id===p.settings.currentLessonId)?p.settings.currentLessonId:library[0].id;}
      current=1;applyStyle();renderLessonSelect();renderButtons();render();
      localStorage.setItem(STORAGE_KEY,JSON.stringify(library));
      localStorage.setItem(SETTINGS_KEY,JSON.stringify({fontSize,lineHeight,currentLessonId}));
      saveStatus.textContent="☁ 已載入最新版";return true;
    }
  }
  saveStatus.textContent=cloudUser?"☁ 已連線｜尚未上傳":"已存本機｜雲端尚空";return false;
}
function markSaving(){
  saveStatus.textContent="儲存本機中…";
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(library));
    settings.currentLessonId=currentLessonId;
    settings.fontSize=fontSize;
    settings.lineHeight=lineHeight;
    localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
    saveStatus.textContent="已存本機";
    if(cloudReady) queueCloudSave();
  },180);
}
function forceSave(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(library));
  settings.currentLessonId=currentLessonId;
  settings.fontSize=fontSize;
  settings.lineHeight=lineHeight;
  localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
  saveStatus.textContent="已存本機";
  if(cloudReady) queueCloudSave();
}

function applyStyle(){
  document.documentElement.style.setProperty("--font-size", fontSize+"px");
  document.documentElement.style.setProperty("--line-height", lineHeight);
  markSaving();
}
function renderLessonSelect(){
  lessonSelect.innerHTML="";
  library.forEach(lesson=>{
    const opt=document.createElement("option");
    opt.value=lesson.id; opt.textContent=lesson.title;
    if(lesson.id===currentLessonId) opt.selected=true;
    lessonSelect.appendChild(opt);
  });
}
function renderButtons(){
  const lesson=currentLesson();
  segButtons.innerHTML="";
  lesson.paragraphs.forEach((_,i)=>{
    const b=document.createElement("button");
    b.className="seg-btn";
    b.textContent=i+1;
    b.onclick=()=>{current=i+1;render();};
    segButtons.appendChild(b);
  });
}
function render(){
  const lesson=currentLesson();
  ensureNotes(lesson);
  titleDisplay.textContent=lesson.title;
  textArea.innerHTML="";
  if(current===0){
    lesson.paragraphs.forEach(p=>{
      const el=document.createElement("p");el.textContent=p;textArea.appendChild(el);
    });
    pageInfo.textContent=`全文｜共 ${lesson.paragraphs.length} 段`;
    document.getElementById("allBtn").classList.add("active");
  }else{
    if(current>lesson.paragraphs.length) current=lesson.paragraphs.length;
    const el=document.createElement("p");
    el.textContent=lesson.paragraphs[current-1] || "";
    textArea.appendChild(el);
    pageInfo.textContent=`第 ${current} 段／共 ${lesson.paragraphs.length} 段`;
    document.getElementById("allBtn").classList.remove("active");
  }
  [...document.querySelectorAll(".seg-btn")].forEach((b,i)=>b.classList.toggle("active", current===i+1));
  readingWrap.scrollLeft=readingWrap.scrollWidth;
  updateNotesPanel();
  clearInk(false);
}

lessonSelect.onchange=()=>{
  currentLessonId=lessonSelect.value; current=1; renderButtons(); render(); markSaving();
}
document.getElementById("allBtn").onclick=()=>{current=0;render()}
document.getElementById("prevBtn").onclick=()=>{
  const n=currentLesson().paragraphs.length;
  if(current===0) current=n; else current=Math.max(1,current-1);
  render();
}
document.getElementById("nextBtn").onclick=()=>{
  const n=currentLesson().paragraphs.length;
  if(current===0) current=1; else current=Math.min(n,current+1);
  render();
}
document.getElementById("fontMinus").onclick=()=>{fontSize=Math.max(30,fontSize-4);applyStyle()}
document.getElementById("fontPlus").onclick=()=>{fontSize=Math.min(84,fontSize+4);applyStyle()}
document.getElementById("gapMinus").onclick=()=>{lineHeight=Math.max(1.25,+(lineHeight-.15).toFixed(2));applyStyle()}
document.getElementById("gapPlus").onclick=()=>{lineHeight=Math.min(3.5,+(lineHeight+.15).toFixed(2));applyStyle()}
document.getElementById("fullscreenBtn").onclick=async()=>{
  if(!document.fullscreenElement) await document.documentElement.requestFullscreen();
  else await document.exitFullscreen();
}

/* 編輯本課 */
const editorModal=document.getElementById("editorModal");
const editTitle=document.getElementById("editTitle");
const editText=document.getElementById("editText");
document.getElementById("editBtn").onclick=()=>{
  const lesson=currentLesson();
  editTitle.value=lesson.title;
  editText.value=lesson.paragraphs.join("\n\n");
  editorModal.classList.add("show");
}
document.getElementById("cancelEdit").onclick=()=>editorModal.classList.remove("show");
document.getElementById("saveEdit").onclick=()=>{
  const title=editTitle.value.trim() || "未命名課文";
  const paragraphs=editText.value.split(/\n\s*\n/).map(s=>s.trim()).filter(Boolean);
  if(!paragraphs.length){alert("請至少貼上一段課文。");return;}
  const lesson=currentLesson();
  lesson.title=title;lesson.paragraphs=paragraphs;lesson.updatedAt=new Date().toISOString();
  ensureNotes(lesson);
  current=Math.min(Math.max(current,1),paragraphs.length);
  renderLessonSelect();renderButtons();render();markSaving();
  editorModal.classList.remove("show");
}

/* 備課筆記 */
const notesPanel=document.getElementById("notesPanel");
const teacherNotes=document.getElementById("teacherNotes");
const notesTitle=document.getElementById("notesTitle");
function updateNotesPanel(){
  const lesson=currentLesson();ensureNotes(lesson);
  if(current===0){
    notesTitle.textContent=`${lesson.title}｜全文備課`;
    teacherNotes.value=lesson.notes.all || "";
  }else{
    notesTitle.textContent=`${lesson.title}｜第 ${current} 段備課`;
    teacherNotes.value=lesson.notes.segments[current-1] || "";
  }  renderNoteImages();
}
document.getElementById("notesBtn").onclick=()=>{notesPanel.classList.toggle("show");updateNotesPanel()}
document.getElementById("closeNotes").onclick=()=>notesPanel.classList.remove("show");
teacherNotes.addEventListener("input",()=>{
  const lesson=currentLesson();ensureNotes(lesson);
  if(current===0) lesson.notes.all=teacherNotes.value;
  else lesson.notes.segments[current-1]=teacherNotes.value;
  lesson.updatedAt=new Date().toISOString();
  markSaving();
});


/* 備課圖片 */
const noteImageInput=document.getElementById("noteImageInput");
const noteImages=document.getElementById("noteImages");
document.getElementById("addNoteImage").onclick=()=>noteImageInput.click();
function currentNoteImages(){
  const lesson=currentLesson();ensureNotes(lesson);
  return current===0 ? lesson.notes.allImages : lesson.notes.segmentImages[current-1];
}
function renderNoteImages(){
  if(!noteImages)return;
  noteImages.innerHTML="";
  currentNoteImages().forEach((src,i)=>{
    const card=document.createElement("div");
    card.style.cssText="position:relative;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:white";
    const img=document.createElement("img");
    img.src=src;img.style.cssText="width:100%;height:125px;object-fit:contain;display:block;background:#fafafa";
    const del=document.createElement("button");
    del.textContent="×";del.title="刪除圖片";
    del.style.cssText="position:absolute;right:5px;top:5px;width:28px;height:28px;border:0;border-radius:50%;background:rgba(255,255,255,.92);cursor:pointer;font-size:18px";
    del.onclick=()=>{currentNoteImages().splice(i,1);renderNoteImages();markSaving();};
    card.append(img,del);noteImages.appendChild(card);
  });
}
noteImageInput.onchange=async()=>{
  const imgs=currentNoteImages();
  for(const file of [...noteImageInput.files]){
    if(!file.type.startsWith("image/"))continue;
    const data=await new Promise((resolve,reject)=>{
      const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file);
    });
    imgs.push(data);
  }
  noteImageInput.value="";renderNoteImages();markSaving();
};

/* 課程庫 */
const libraryModal=document.getElementById("libraryModal");
document.getElementById("libraryBtn").onclick=()=>{
  document.getElementById("libraryCurrentTitle").value=currentLesson().title;
  libraryModal.classList.add("show");
}
document.getElementById("closeLibrary").onclick=()=>libraryModal.classList.remove("show");

document.getElementById("newLesson").onclick=()=>{
  const title=prompt("新課程名稱：","新課文");
  if(!title)return;
  const lesson={
    id:uid(),title:title.trim()||"新課文",paragraphs:["請按「編輯課文」貼上第一段。"],
    notes:{all:"",segments:[""],allImages:[],segmentImages:[[]]},
    createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()
  };
  library.push(lesson);currentLessonId=lesson.id;current=1;
  renderLessonSelect();renderButtons();render();markSaving();
  document.getElementById("libraryCurrentTitle").value=lesson.title;
}
document.getElementById("duplicateLesson").onclick=()=>{
  const src=currentLesson();
  const copy=JSON.parse(JSON.stringify(src));
  copy.id=uid();copy.title=src.title+"（複製）";
  copy.createdAt=new Date().toISOString();copy.updatedAt=new Date().toISOString();
  library.push(copy);currentLessonId=copy.id;current=1;
  renderLessonSelect();renderButtons();render();markSaving();
  document.getElementById("libraryCurrentTitle").value=copy.title;
}
document.getElementById("deleteLesson").onclick=()=>{
  if(library.length<=1){alert("至少要保留一個課程。");return;}
  const lesson=currentLesson();
  if(!confirm(`確定刪除「${lesson.title}」？`)) return;
  library=library.filter(x=>x.id!==lesson.id);
  currentLessonId=library[0].id;current=1;
  renderLessonSelect();renderButtons();render();markSaving();
  document.getElementById("libraryCurrentTitle").value=currentLesson().title;
}
function makePayload(){
  forceSave();
  return {
    app:"405 國語課專用閱讀器",
    version:4,
    exportedAt:new Date().toISOString(),
    library,
    settings:{fontSize,lineHeight,currentLessonId}
  };
}
function downloadSyncFile(){
  const payload=makePayload();
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="405國語課閱讀器_同步資料.json";
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  saveStatus.textContent="同步檔已匯出";
}
async function importPayloadFile(file){
  const data=JSON.parse(await file.text());
  if(!Array.isArray(data.library)||!data.library.length) throw new Error("格式不符");
  library=data.library;
  library.forEach(ensureNotes);
  if(data.settings){
    fontSize=data.settings.fontSize||fontSize;
    lineHeight=data.settings.lineHeight||lineHeight;
    currentLessonId=library.some(x=>x.id===data.settings.currentLessonId)?data.settings.currentLessonId:library[0].id;
  }else currentLessonId=library[0].id;
  current=1;applyStyle();renderLessonSelect();renderButtons();render();forceSave();
  saveStatus.textContent="同步完成";
}
const quickImportFile=document.getElementById("quickImportFile");
document.getElementById("quickExport").onclick=async()=>{if(await cloudLogin()){cloudReady=true;await saveCloud(true);}};
document.getElementById("quickImport").onclick=async()=>{await refreshCloudUser();await loadCloud(true);};
quickImportFile.onchange=async()=>{
  const file=quickImportFile.files[0]; if(!file)return;
  try{
    if(confirm("要用這份同步資料更新目前這台電腦的課程庫嗎？")){
      await importPayloadFile(file);
      alert("同步完成。現在這台電腦已載入最新課程與備課筆記。");
    }
  }catch(e){alert("無法同步：這不是有效的閱讀器同步檔。");}
  quickImportFile.value="";
};


document.getElementById("exportLesson").onclick=()=>{
  forceSave();
  const lesson=currentLesson();
  const payload={app:"405 國語課專用閱讀器",version:4.2,type:"single-lesson",exportedAt:new Date().toISOString(),lesson};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json;charset=utf-8"});
  const a=document.createElement("a");
  const safe=(lesson.title||"課文").replace(/[\\/:*?"<>|]/g,"_");
  a.href=URL.createObjectURL(blob);a.download=`405國語_${safe}_單課備份.json`;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
const importLessonFile=document.getElementById("importLessonFile");
document.getElementById("importLesson").onclick=()=>importLessonFile.click();
importLessonFile.onchange=async()=>{
  const file=importLessonFile.files[0];if(!file)return;
  try{
    const data=JSON.parse(await file.text());
    if(!data.lesson||!Array.isArray(data.lesson.paragraphs))throw new Error();
    const lesson=JSON.parse(JSON.stringify(data.lesson));
    lesson.id=uid();lesson.createdAt=new Date().toISOString();lesson.updatedAt=new Date().toISOString();
    ensureNotes(lesson);library.push(lesson);currentLessonId=lesson.id;current=1;
    renderLessonSelect();renderButtons();render();forceSave();
    document.getElementById("libraryCurrentTitle").value=lesson.title;
    alert(`已匯入「${lesson.title}」。`);
  }catch(e){alert("無法匯入：這不是有效的單課備份檔。");}
  importLessonFile.value="";
};

document.getElementById("exportAll").onclick=()=>{
  const payload=makePayload();
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json;charset=utf-8"});
  const a=document.createElement("a");
  const stamp=new Date().toISOString().slice(0,10);
  a.href=URL.createObjectURL(blob);
  a.download=`405國語課閱讀器_全部備份_${stamp}.json`;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
const importFile=document.getElementById("importFile");
document.getElementById("importAll").onclick=()=>importFile.click();
importFile.onchange=async()=>{
  const file=importFile.files[0]; if(!file)return;
  try{
    const data=JSON.parse(await file.text());
    if(!Array.isArray(data.library)||!data.library.length) throw new Error("格式不符");
    if(!confirm("匯入會用備份內容取代目前課程庫。確定繼續？")) return;
    library=data.library;
    library.forEach(ensureNotes);
    if(data.settings){
      fontSize=data.settings.fontSize||fontSize;
      lineHeight=data.settings.lineHeight||lineHeight;
      currentLessonId=library.some(x=>x.id===data.settings.currentLessonId)?data.settings.currentLessonId:library[0].id;
    }else currentLessonId=library[0].id;
    current=1;applyStyle();renderLessonSelect();renderButtons();render();forceSave();
    alert("備份已匯入。");
    libraryModal.classList.remove("show");
  }catch(e){alert("無法匯入：這不是有效的閱讀器備份檔。")}
  importFile.value="";
}

/* 書寫層：筆 / 淡色直線螢光筆 / 橡皮擦 */
const canvas=document.getElementById("inkCanvas");
const ctx=canvas.getContext("2d");
let drawing=false,last=null,tool="pen",start=null,snapshot=null;

function resizeCanvas(){
  const rect=stage.getBoundingClientRect();
  canvas.width=Math.floor(rect.width*devicePixelRatio);
  canvas.height=Math.floor(rect.height*devicePixelRatio);
  canvas.style.width=rect.width+"px";canvas.style.height=rect.height+"px";
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}
window.addEventListener("resize",resizeCanvas);
function point(e){
  const r=canvas.getBoundingClientRect();
  return {x:e.clientX-r.left,y:e.clientY-r.top};
}
function drawStraightHighlight(a,b){
  ctx.globalCompositeOperation="source-over";
  ctx.strokeStyle="rgba(255, 226, 72, 0.20)";
  ctx.lineWidth=24;
  ctx.lineCap="round";
  const x=a.x; // 垂直吸附：固定起點 x
  ctx.beginPath();ctx.moveTo(x,a.y);ctx.lineTo(x,b.y);ctx.stroke();
}
canvas.addEventListener("pointerdown",e=>{
  drawing=true;start=point(e);last=start;canvas.setPointerCapture(e.pointerId);
  if(tool==="highlighter"){
    snapshot=ctx.getImageData(0,0,canvas.width,canvas.height);
  }
});
canvas.addEventListener("pointermove",e=>{
  if(!drawing)return;
  const p=point(e);
  if(tool==="highlighter"){
    if(snapshot) ctx.putImageData(snapshot,0,0);
    drawStraightHighlight(start,p);
    return;
  }
  ctx.lineCap="round";ctx.lineJoin="round";
  if(tool==="eraser"){
    ctx.globalCompositeOperation="destination-out";ctx.lineWidth=30;
  }else{
    ctx.globalCompositeOperation="source-over";ctx.strokeStyle="#d93c36";ctx.lineWidth=4;
  }
  ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;
});
canvas.addEventListener("pointerup",e=>{
  if(!drawing)return;
  if(tool==="highlighter"){
    const p=point(e);
    if(snapshot) ctx.putImageData(snapshot,0,0);
    drawStraightHighlight(start,p);
  }
  drawing=false;snapshot=null;
});
canvas.addEventListener("pointercancel",()=>{drawing=false;snapshot=null});

function setTool(name){
  tool=name;stage.classList.add("drawing");
  document.getElementById("exitDraw").style.display="";
  document.querySelectorAll("[data-tool]").forEach(x=>x.classList.toggle("active",x.dataset.tool===name));
  document.getElementById("penQuick").classList.toggle("active",name==="pen");
  document.getElementById("highlighterQuick").classList.toggle("active",name==="highlighter");
}
function exitDrawing(){
  stage.classList.remove("drawing");
  document.getElementById("exitDraw").style.display="none";
  document.getElementById("penQuick").classList.remove("active");
  document.getElementById("highlighterQuick").classList.remove("active");
}
document.getElementById("penQuick").onclick=()=>setTool("pen");
document.getElementById("highlighterQuick").onclick=()=>setTool("highlighter");
document.getElementById("exitDraw").onclick=exitDrawing;
document.querySelectorAll("[data-tool]").forEach(b=>b.onclick=()=>setTool(b.dataset.tool));
function clearInk(confirmFirst=true){
  if(confirmFirst && !confirm("清除目前畫面上的筆記？"))return;
  ctx.clearRect(0,0,canvas.width,canvas.height);
}
document.getElementById("clearInk").onclick=()=>clearInk(true);

/* 初始化 */
applyStyle();
renderLessonSelect();
renderButtons();
resizeCanvas();
render();
forceSave();
(async()=>{await refreshCloudUser(); cloudReady=true; await loadCloud(false);})();
</script>
