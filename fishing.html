<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one narrow "stage" column; a 3-step strip on top, one panel at a time, a persistent time-bank badge. Single dark pixel look by choice. */
:root{
  --ink:#0a1830; --deep:#102f56; --sea:#1a5a96; --foam:#cdeeff; --sun:#ffd23f; --coral:#ff6b4a;
  --text:#eaf6ff; --mute:#9bbbd8; --good:#5ee08a; --bad:#ff7b7b; --line:#000;
  --f-d:"DotGothic16","PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
  --f-n:"Press Start 2P","Courier New",monospace;
  --f-b:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--ink); color:var(--text); font-family:var(--f-b); font-size:16px; line-height:1.6;
  padding-block:14px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-d);font-size:1.9rem;margin:0;color:var(--sun);letter-spacing:.08em;text-shadow:3px 3px 0 #000}
h2{font-family:var(--f-d);font-size:1.5rem;margin:4px 0 8px;color:var(--foam);text-wrap:balance}
.bank{border:4px solid var(--line);background:var(--deep);padding:6px 12px;display:flex;align-items:center;gap:10px;box-shadow:4px 4px 0 #000a}
.bank span{font-size:.85rem;color:var(--mute)}
.bank b{font-family:var(--f-n);font-size:1rem;color:var(--sun);font-variant-numeric:tabular-nums}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.steps li{font-family:var(--f-d);text-align:center;padding:6px 4px;background:#0d2447;border:3px solid #1c3f6e;color:var(--mute)}
.steps li.on{background:var(--sun);color:var(--ink);border-color:#000}
.steps li.done{color:var(--good);border-color:var(--good)}
.panel{background:var(--deep);border:4px solid var(--foam);box-shadow:6px 6px 0 #000a;padding:18px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end;margin-top:12px}
label{color:var(--mute);font-size:.9rem}
select,input{font:inherit;color:var(--text);background:#0a2142;border:3px solid var(--foam);padding:6px 10px;border-radius:0;min-width:0}
.passage{white-space:pre-wrap;font-size:1.3rem;line-height:2.1;letter-spacing:.08em;margin:6px 0 14px;background:#0a2142;border:3px solid #1c3f6e;padding:14px 16px;max-width:100%}
.rounds{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px;color:var(--mute)}
#dots{display:inline-flex;gap:6px}
.dot{width:18px;height:18px;border:3px solid var(--foam);background:transparent}
.dot.on{background:var(--sun);border-color:#000}
.live{min-height:3.4em;background:#07162c;border:3px dashed #2b5d93;padding:8px 12px;margin-bottom:12px;color:var(--mute);overflow-wrap:anywhere}
.live.hot{color:var(--text);border-color:var(--coral)}
.btn{font-family:var(--f-d);font-size:1.05rem;color:var(--ink);background:var(--sun);border:4px solid #000;box-shadow:0 4px 0 #a07800;padding:9px 16px;cursor:pointer;border-radius:0}
.btn:active:not([disabled]){transform:translateY(3px);box-shadow:0 1px 0 #a07800}
.btn.alt{background:var(--foam);box-shadow:0 4px 0 #5f8fb0}
.btn.rec{background:var(--coral);box-shadow:0 4px 0 #9a3320;color:#fff}
.btn.sm{padding:4px 12px;font-size:.95rem}
.btn[disabled]{background:#3d5069;color:#8aa0b8;box-shadow:0 4px 0 #26344a;cursor:not-allowed}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible,canvas:focus-visible{outline:3px dashed var(--sun);outline-offset:3px}
.msg{min-height:1.6em;margin:10px 0 0;font-size:.98rem}
.msg.good{color:var(--good)} .msg.bad{color:var(--bad)}
details{margin-top:12px;border:3px solid #1c3f6e;padding:8px 12px;background:#0a2142}
summary{cursor:pointer;color:var(--mute)}
details .row{margin-top:8px}
.qhead{display:flex;justify-content:space-between;gap:10px;color:var(--mute);font-size:.95rem}
.opts{display:grid;gap:10px;margin-top:10px}
.opt{font-family:var(--f-d);font-size:1.15rem;text-align:left;color:var(--text);background:#0a2142;border:4px solid var(--foam);padding:10px 14px;cursor:pointer;border-radius:0}
.opt:hover:not([disabled]){background:#143a6b}
.opt.good{background:#1d6b3c;border-color:var(--good)}
.opt.bad{background:#7a2a2a;border-color:var(--bad)}
.opt[disabled]{cursor:default}
.hud{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:8px;font-family:var(--f-d)}
.hud b{font-family:var(--f-n);font-size:.95rem;color:var(--sun);font-variant-numeric:tabular-nums;margin-left:4px}
.hud .btn{margin-left:auto}
#cv{display:block;width:100%;max-width:100%;aspect-ratio:4/3;image-rendering:pixelated;border:4px solid #000;background:#2a7cc4;touch-action:manipulation;cursor:pointer}
.hint{margin:8px 0 0;color:var(--mute);font-size:.92rem}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:8px 0 0;padding:0;list-style:none;font-size:.88rem;color:var(--mute)}
.legend li{display:flex;align-items:center;gap:6px}
.legend canvas{image-rendering:pixelated}
.big{font-family:var(--f-n);font-size:1.6rem;color:var(--sun);margin:8px 0;font-variant-numeric:tabular-nums}
.tally{display:flex;flex-wrap:wrap;gap:6px 16px;margin:10px 0 14px;padding:0;list-style:none}
.teacher textarea{width:100%;min-height:9em;font:13px/1.5 ui-monospace,Menlo,monospace;color:var(--text);background:#07162c;border:3px solid var(--foam);padding:8px;border-radius:0}
.teacher p{margin:6px 0;color:var(--mute);font-size:.9rem}
@media (prefers-reduced-motion:reduce){.btn:active:not([disabled]){transform:none}}
@media (max-width:480px){h1{font-size:1.5rem}.passage{font-size:1.15rem}}
</style>
</head>
<body>

<main class="wrap">
  <header class="top">
    <h1>朗讀釣魚島</h1>
    <div class="bank" title="朗讀換來的遊戲時間"><span>遊戲時間</span><b id="bankTime">0:00</b></div>
  </header>
  <ol class="steps" id="steps">
    <li data-s="read" class="on">1 朗讀</li><li data-s="quiz">2 測驗</li><li data-s="game">3 釣魚</li>
  </ol>

  <section id="s-read" class="panel">
    <div class="row"><label for="lessonSel">課文</label><select id="lessonSel"></select></div>
    <h2 id="lTitle"></h2>
    <p class="passage" id="lText"></p>
    <div class="rounds"><span>朗讀次數</span><span id="dots"></span><span id="roundTxt"></span></div>
    <div class="live" id="live" aria-live="polite"></div>
    <div class="row">
      <button class="btn rec" id="btnStart">● 開始朗讀</button>
      <button class="btn alt" id="btnDone" disabled>完成這一遍</button>
    </div>
    <p class="msg" id="readMsg" aria-live="polite"></p>
    <details id="helper">
      <summary>家長確認（收不到音、或沒有麥克風時使用）</summary>
      <div class="row">
        <input id="pinRead" type="password" inputmode="numeric" autocomplete="off" placeholder="家長密碼" aria-label="家長密碼">
        <button class="btn alt sm" id="btnTeacher">家長確認一遍</button>
      </div>
    </details>
    <div class="row end"><button class="btn" id="btnToQuiz" disabled>開始閱讀測驗 ▶</button></div>
  </section>

  <section id="s-quiz" class="panel" hidden>
    <div class="qhead"><span id="qNo"></span><span id="qBank"></span></div>
    <h2 id="qText"></h2>
    <div class="opts" id="opts"></div>
    <p class="msg" id="qMsg" aria-live="polite"></p>
    <div class="row end"><button class="btn" id="btnNext" hidden>下一題 ▶</button></div>
  </section>

  <section id="s-game" hidden>
    <div class="hud">
      <div>時間<b id="hTime">0:00</b></div>
      <div>分數<b id="hScore">0</b></div>
      <button class="btn alt sm" id="btnPause">暫停</button>
    </div>
    <canvas id="cv" width="400" height="300" tabindex="0" aria-label="釣魚遊戲畫面，點一下或按空白鍵放下釣鉤"></canvas>
    <p class="hint">點一下畫面或按空白鍵放下釣鉤。釣起河豚會爆炸，把附近的垃圾炸掉；釣到章魚，海底會黑五秒；寶箱藏著驚喜。</p>
    <ul class="legend" id="legend"></ul>
  </section>

  <section id="s-end" class="panel" hidden>
    <h2 id="endTitle">遊戲結束</h2>
    <div class="big" id="endScore">0</div>
    <p id="endBest"></p>
    <ul class="tally" id="tally"></ul>
    <div class="row"><button class="btn" id="btnAgain">再讀一課，賺更多時間</button></div>
  </section>

  <details class="teacher" id="teacher">
    <summary>教師設定</summary>
    <div id="tLock" class="row">
      <input id="pinT" type="password" inputmode="numeric" autocomplete="off" placeholder="管理密碼" aria-label="管理密碼">
      <button class="btn alt sm" id="btnUnlock">解鎖</button>
      <span class="msg" id="tMsg"></span>
    </div>
    <div id="tBody" hidden>
      <p>課文與題目（JSON）。每題的 o 是選項，a 是正確選項的編號（從 0 開始）。套用後只存在這台瀏覽器，不會傳給學生。要改全班的課文，請更換網站檔案。</p>
      <textarea id="lessonJson" spellcheck="false" aria-label="課文 JSON"></textarea>
      <div class="row" style="margin-top:8px">
        <button class="btn alt sm" id="btnApply">套用課文</button>
        <button class="btn alt sm" id="btnReset">還原範例課文</button>
      </div>
      <p class="msg" id="tMsg2"></p>
    </div>
  </details>
</main>

  [["#2f86cf", SEA, 112], ["#2573b8", 112, 182], ["#1b5c9b", 182, 246], ["#144a82", 246, H]].forEach(b => { g.fillStyle = b[0]; g.fillRect(0, b[1], W, b[2] - b[1]); });
  g.fillStyle = "#cdeeff";
  for (let x = -12; x < W; x += 12) g.fillRect(x + ((G.tick >> 3) % 12), SEA, 6, 2);
  g.fillStyle = "#e8c37a"; g.fillRect(0, H - 12, W, 12);
  g.fillStyle = "#c9a15a"; for (let x = 4; x < W; x += 22) g.fillRect(x, H - 6, 3, 2);
  g.fillStyle = "#3aa55b";
  [24, 96, 172, 252, 330, 382].forEach(x => { g.fillRect(x, H - 34, 3, 22); g.fillRect(x + 3, H - 26, 3, 14); g.fillRect(x - 3, H - 22, 3, 10); });
  g.globalAlpha = .35; g.fillStyle = "#fff";
  for (let i = 0; i < 6; i++) g.fillRect(40 + i * 62, H - ((G.tick * .4 + i * 47) % (H - SEA)), 2, 2);
  g.globalAlpha = 1;
  G.objs.forEach(o => {
    const im = T[o.k].img, x = Math.round(o.x - o.w / 2), y = Math.round(o.y - o.h / 2);
    if (o.v > 0) { g.save(); g.translate(Math.round(o.x + o.w / 2), 0); g.scale(-1, 1); g.drawImage(im, 0, y); g.restore(); }
    else g.drawImage(im, x, y);
  });
  const p = tip(), hk = G.hook;
  g.fillStyle = "#eaf6ff";
  for (let l = 0; l < hk.len; l += 1) g.fillRect(Math.round(OX + Math.sin(hk.ang) * l), Math.round(OY + Math.cos(hk.ang) * l), 1, 1);
  g.fillStyle = "#cfd8e3"; g.fillRect(Math.round(p.x) - 3, Math.round(p.y), 7, 2); g.fillRect(Math.round(p.x) - 3, Math.round(p.y) + 2, 2, 3); g.fillRect(Math.round(p.x) + 2, Math.round(p.y) + 2, 2, 3);
  G.fx.forEach(q => { g.fillStyle = q.c; g.fillRect(Math.round(q.x), Math.round(q.y), 3, 3); });
  if (G.ink > 0) {
    g.globalAlpha = G.ink < .6 ? G.ink / .6 : 1; g.fillStyle = "#000"; g.fillRect(0, SEA, W, H - SEA); g.globalAlpha = 1;
    g.fillStyle = "#6f7f93"; g.font = "12px DotGothic16, sans-serif"; g.textAlign = "center";
    g.fillText("章魚噴墨！海底一片漆黑（" + Math.ceil(G.ink) + "）", W / 2, SEA + 40);
  }
  g.fillStyle = "#8b5a2b"; g.fillRect(OX - 32, SEA - 10, 56, 6); g.fillRect(OX - 26, SEA - 4, 44, 4);
  g.fillStyle = "#d9482b"; g.fillRect(OX - 32, SEA - 12, 56, 2);
  g.fillStyle = "#f4e3b2"; g.fillRect(OX - 24, SEA - 26, 14, 14); g.fillStyle = "#7fd0ff"; g.fillRect(OX - 21, SEA - 23, 8, 6);
  g.fillStyle = "#5a3b1a"; for (let i = 0; i <= 14; i++) g.fillRect(OX - 14 + i, Math.round(SEA - 12 - i * (10 / 14)), 2, 2);
  g.font = "11px DotGothic16, sans-serif"; g.textAlign = "center";
  G.txt.forEach(t => { g.globalAlpha = Math.min(1, t.life * 2); g.fillStyle = "#000"; g.fillText(t.s, t.x + 1, t.y + 1); g.fillStyle = t.c; g.fillText(t.s, t.x, t.y); });
  g.globalAlpha = 1;
  if (G.paused) { g.fillStyle = "rgba(0,0,0,.55)"; g.fillRect(0, 0, W, H); g.fillStyle = "#ffd23f"; g.font = "20px DotGothic16, sans-serif"; g.fillText("暫停中", W / 2, H / 2); }
}
function startGame() {
  const mine = G = {
    t: S.bank, objs: [], fx: [], txt: [], hook: { ang: 0, dir: 1, len: MINLEN, st: "swing", obj: null },
    ink: 0, run: true, paused: false, last: performance.now(), spawnT: 0, trashT: 0, chestT: 0, tick: 0
  };
  S.score = 0; S.caught = {};
  for (const k in T) for (let i = 0; i < (T[k].cnt || 0); i++) spawn(k);
  for (let i = 0; i < 4; i++) spawn(i % 2 ? "t1" : "t2");
  spawn("ch");
  show("game");
  $("#hScore").textContent = "0"; $("#hTime").textContent = fmt(G.t); $("#btnPause").textContent = "暫停";
  cv.focus({ preventScroll: true });
  (function loop(ts) {
    if (G !== mine || !mine.run) return;
    const dt = Math.min(.05, (ts - mine.last) / 1000 || 0); mine.last = ts;
    if (!mine.paused) { mine.tick++; update(dt); }
    if (G === mine && mine.run) { draw(); requestAnimationFrame(loop); }
  })(performance.now());
}
function launch() { if (G && G.run && !G.paused && G.hook.st === "swing") G.hook.st = "out"; }
function togglePause(force) {
  if (!G || !G.run) return;
  G.paused = typeof force === "boolean" ? force : !G.paused;
  $("#btnPause").textContent = G.paused ? "繼續" : "暫停";
}
function endGame(noTime) {
  if (G) G.run = false;
  if (noTime) { S.score = 0; S.caught = {}; }
  S.bank = 0; drawBank();
  const best = ls.get("best", 0);
  if (S.score > best) ls.set("best", S.score);
  $("#endTitle").textContent = noTime ? "遊戲時間用完了" : "時間到！";
  $("#endScore").textContent = S.score + " 分";
  $("#endBest").textContent = noTime ? "測驗答錯太多，時間都扣光了。再讀幾遍課文，就能換回遊戲時間。"
    : S.score > best ? "新紀錄！" : "這台裝置的最高分：" + best + " 分";
  const entries = Object.entries(S.caught);
  $("#tally").innerHTML = entries.length ? entries.map(e => `<li>${T[e[0]].n} ×${e[1]}</li>`).join("") : "<li>這次沒有釣到東西</li>";
  show("end");
}
/* ---------- Wiring ---------- */
function fillSel() {
  const sel = $("#lessonSel"); sel.innerHTML = "";
  LESSONS.forEach((l, i) => { const o = document.createElement("option"); o.value = i; o.textContent = l.title; sel.appendChild(o); });
}
function resetFlow() { loadLesson(Math.min(S.lesson, LESSONS.length - 1)); $("#lessonSel").value = S.lesson; show("read"); }

$("#lessonSel").addEventListener("change", e => loadLesson(+e.target.value));
$("#btnStart").addEventListener("click", startReading);
$("#btnDone").addEventListener("click", finishReading);
$("#btnTeacher").addEventListener("click", teacherConfirm);
$("#btnToQuiz").addEventListener("click", startQuiz);
$("#btnNext").addEventListener("click", nextQuestion);
$("#btnPause").addEventListener("click", () => togglePause());
$("#btnAgain").addEventListener("click", resetFlow);
cv.addEventListener("pointerdown", e => { e.preventDefault(); launch(); });
document.addEventListener("keydown", e => {
  if ($("#s-game").hidden) return;
  if (e.target !== cv && e.target !== document.body) return;
  if (e.code === "Space" || e.code === "ArrowDown") { e.preventDefault(); launch(); }
  else if (e.code === "KeyP") togglePause();
});
document.addEventListener("visibilitychange", () => { if (document.hidden) togglePause(true); });

/* ---------- Teacher panel ---------- */
const pinOk = v => v === PIN;
$("#btnUnlock").addEventListener("click", () => {
  if (!pinOk($("#pinT").value)) { setMsg($("#tMsg"), "密碼不對。", "bad"); return; }
  $("#pinT").value = ""; setMsg($("#tMsg"), "");
  $("#tLock").hidden = true; $("#tBody").hidden = false;
  $("#lessonJson").value = JSON.stringify(LESSONS, null, 2);
});
$("#btnApply").addEventListener("click", () => {
  let arr = null;
  try { arr = JSON.parse($("#lessonJson").value); } catch (e) { setMsg($("#tMsg2"), "JSON 格式有誤，請檢查逗號與引號。", "bad"); return; }
  if (!validLessons(arr)) { setMsg($("#tMsg2"), "每一課都需要 title、text，以及至少一題 quiz（q、o 兩個以上選項、a 為正確選項編號）。", "bad"); return; }
  LESSONS = arr; ls.set("lessons", arr); S.lesson = 0; fillSel(); loadLesson(0);
  setMsg($("#tMsg2"), `已套用，共 ${arr.length} 課。`, "good");
});
$("#btnReset").addEventListener("click", () => {
  ls.del("lessons"); LESSONS = SAMPLE; S.lesson = 0; fillSel(); loadLesson(0);
  $("#lessonJson").value = JSON.stringify(LESSONS, null, 2);
  setMsg($("#tMsg2"), "已還原範例課文。", "good");
});

/* ---------- Browser speech fallback (works when the page is hosted as a normal site) ---------- */
function browserSpeech() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;
  let rec = null, state = "idle", stopping = false, onP = () => {}, onF = () => {}, onS = () => {}, endWaiters = [];
  const set = (s, reason) => { state = s; onS(reason ? { state: s, reason } : { state: s }); };
  return {
    start() {
      return new Promise((resolve, reject) => {
        if (state !== "idle") { resolve(); return; }
        let opened = false; stopping = false;
        rec = new SR(); rec.lang = "zh-TW"; rec.continuous = true; rec.interimResults = true;
        rec.onstart = () => { opened = true; set("listening"); resolve(); };
        rec.onresult = ev => {
          let interim = "";
          for (let i = ev.resultIndex; i < ev.results.length; i++) {
            const r = ev.results[i];
            if (r.isFinal) { onP({ text: "" }); onF({ text: r[0].transcript }); } else interim += r[0].transcript;
          }
          if (interim) onP({ text: interim });
        };
        rec.onerror = ev => {
          const c = ev.error === "not-allowed" || ev.error === "service-not-allowed" ? "not_granted" : ev.error === "no-speech" || ev.error === "aborted" ? null : "upstream_error";
          if (c && !opened) reject({ code: c, message: ev.error });
          if (c) rec._err = c;
        };
        rec.onend = () => {
          const reason = stopping ? "stopped" : rec._err || "viewer_stopped";
          if (!opened) reject({ code: rec._err || "upstream_error", message: "no start" });
          set("idle", reason);
          endWaiters.forEach(f => f()); endWaiters = [];
        };
        try { rec.start(); } catch (e) { reject({ code: "upstream_error", message: String(e) }); }
      });
    },
    stop() {
      return new Promise(res => {
        if (state === "idle") { res(); return; }
        stopping = true; endWaiters.push(res);
        try { rec.stop(); } catch (e) { res(); }
      });
    },
    active: () => state !== "idle",
    onPartial: f => { onP = f; return () => {}; },
    onFinal: f => { onF = f; return () => {}; },
    onState: f => { onS = f; return () => {}; }
  };
}

/* ---------- Dictation (speech check) ---------- */
(async function initDictation() {
  try { dict = window.claude && window.claude.use ? await window.claude.use("dictation") : null; } catch (e) { dict = null; }
  if (!dict) dict = browserSpeech();
  if (!dict) {
    $("#helper").open = true;
    $("#btnStart").disabled = true; $("#btnDone").disabled = true;
    setMsg($("#readMsg"), "這裡無法收音驗證，請家長在下方輸入密碼，協助確認每一遍。");
    return;
  }
  dict.onPartial(e => { partial = e.text; drawLive(); });
  dict.onFinal(e => { heard += e.text; partial = ""; drawLive(); });
  dict.onState(e => {
    listening = e.state !== "idle";
    $("#btnStart").textContent = listening ? "● 聽著呢…" : "● 開始朗讀";
    $("#btnStart").disabled = listening || S.rounds >= MAX_ROUNDS;
    $("#btnDone").disabled = e.state !== "listening";
    if (e.state === "idle" && e.reason === "viewer_stopped") judge();
    else if (e.state === "idle" && (e.reason === "hidden" || e.reason === "upstream_error" || e.reason === "time_limit"))
      setMsg($("#readMsg"), "收音中斷了，請再按「開始朗讀」。", "bad");
    drawLive();
  });
})();

fillSel(); loadLesson(0);
</script>
